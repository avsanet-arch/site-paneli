name: Rakipleri tara
on:
  schedule:
    - cron: "0 4 * * *"   # her gün 07:00 (Türkiye)
  workflow_dispatch:
permissions:
  contents: write
concurrency: kayit
jobs:
  rakip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python rakip.py
      - name: Sonuçları kaydet
        run: |
          git config user.name "site-paneli"
          git config user.email "site-paneli@users.noreply.github.com"
          git add rakipler.html rakip_durum.json
          git commit -m "Rakip taraması: $(date -u +%Y-%m-%d)" || echo "değişiklik yok"
          git pull --rebase && git push
