<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="300"><title>Sitelerim</title>
<style>
:root{--bg:#f6f7f9;--kart:#fff;--yazi:#1d2330;--soluk:#6b7280;--cizgi:#e5e7eb;--yesil:#16a34a;--kirmizi:#dc2626;--sari:#d97706}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--kart:#181c24;--yazi:#e6e8ec;--soluk:#9aa1ad;--cizgi:#2a303b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--yazi);font:15px/1.5 system-ui,sans-serif;padding:24px 16px}
.kap{max-width:1000px;margin:auto}h1{margin:0 0 4px;font-size:24px}
.ozet{padding:12px 16px;border-radius:10px;margin:16px 0;font-weight:600;color:#fff}.ozet.up{background:var(--yesil)}.ozet.down{background:var(--kirmizi)}
.izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;padding:16px}
.ust{display:flex;align-items:center;gap:8px;font-weight:600}.ust a{color:inherit;text-decoration:none;flex:1;overflow:hidden;text-overflow:ellipsis}
.nokta{width:10px;height:10px;border-radius:50%;background:var(--yesil)}.down .nokta{background:var(--kirmizi)}
.durum{font-size:12px;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--yesil) 15%,transparent);color:var(--yesil)}
.down .durum{background:color-mix(in srgb,var(--kirmizi) 15%,transparent);color:var(--kirmizi)}
.olcu{display:grid;grid-template-columns:repeat(3,1fr);margin:12px 0}.olcu small,.detay{color:var(--soluk);font-size:12px}.olcu b{display:block;font-size:17px}
.iyi{color:var(--yesil)}.uyari{color:var(--sari)}.kotu{color:var(--kirmizi)}
.cubuk{display:flex;gap:2px;height:22px;margin-bottom:6px}.cubuk i{flex:1;border-radius:2px;background:var(--yesil)}.cubuk i.d{background:var(--kirmizi)}
.oneri{margin-top:10px;border-top:1px solid var(--cizgi);padding-top:8px}.oneri summary{cursor:pointer;font-weight:600;font-size:13px}
.oneri ul{list-style:none;padding:0;margin:8px 0 0;font-size:13px}.oneri li{padding:4px 0;display:flex;gap:8px;align-items:baseline}
.oneri li span{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;flex:none}
.oneri .yuksek span{background:color-mix(in srgb,var(--kirmizi) 15%,transparent);color:var(--kirmizi)}
.oneri .orta span{background:color-mix(in srgb,var(--sari) 15%,transparent);color:var(--sari)}
.oneri .dusuk span{background:var(--cizgi);color:var(--soluk)}
</style></head><body><div class="kap">
